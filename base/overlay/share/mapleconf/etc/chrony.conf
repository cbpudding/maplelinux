{% assign tscount = system.timeservers | size %}
{% assign timeoptions = "iburst" %}

{% if tscount == 1 %}
pool {{ system.timeservers | first }} {{ timeoptions }}
{% else %}
{% for ts in system.timeservers %}server {{ ts }} {{ timeoptions }}
{% endfor %}
{% endif %}

cmdport 0
driftfile /cache/chronyd/drift
leapseclist /share/zoneinfo/leap-seconds.list
makestep 1.0 3
maxchange 1000 1 2
{% if system.timeservers.size > 1 %}minsources 2
{% endif %}pidfile /tmp/chronyd.pid
port 0
rtcsync
